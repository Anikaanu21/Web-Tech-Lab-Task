<!DOCTYPE html>
<html>
<head>
    <title>Text Analyzer</title>
 
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(135, 26, 82);
            text-align: center;
            padding-top: 50px;
        }
 
        h1 {
            text-align: center;
            color: #130701;
        }
 
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
 
    button {
      margin-top: 10px;
      padding: 10px ;
      font-size: 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
 
    #result {
            margin-top: 15px;
            background-color: rgb(232, 91, 199);
            padding: 10px;
            border-radius: 5px;
            white-space: pre-line; 
        }
    </style>
 
</head>
 
<body>
 
<h1>Text Analyzer</h1>
 
<p>Write your text:</p>
 
<textarea id="textInput"></textarea>
 
<button onclick="analyzeText()">Analyze Text</button>
 
<div id="result"></div>
 
<script>
function analyzeText()
{
    var text = document.getElementById("textInput").value;

    if(text === "")
    {
        alert("Please enter some text");
        return;
    }
    var charCount = text.length;
    var words = text.split("");
    var wordCount = words.length;
    var reversed = text.split("").reverse().join("");

    document.getElementById("result").innerHTML = "Characters: "+charCount+"<br>Words: "+wordCount+"<br>Reversed Text: "+reversed;
    

    
}
</script>
 
</body>
</html>
